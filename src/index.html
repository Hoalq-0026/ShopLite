<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>ShopLite-Danh sách sản phẩm</title>

    <link rel="stylesheet" href="./styles.css"/>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="./index.html" class="logo">ShopLite</a>

            <form class="search-form" aria-label="Tìm kiếm sản phẩm">
                <input type="search" placeholder="Tìm sản phẩm..." aria-label="Tìm sản phẩm"/>
            </form>

            <button class="cart-button" type="button" aria-label="Giỏ hàng">
                <span class="cart-icon">🛒</span>
                <span class="cart-badge">3</span>
            </button>
        </div>
    </header>
    <main>
        <section class="products-section">
            <div class="container">
                <div class="section-heading">
                    <h1>Sản phẩm</h1>
                </div>

                <div class="products-grid" id="productsGrid">
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; 2026 ShopLite. All rights reserved.</p>

            <nav class="footer-nav" aria-label="Liên kết nhanh">
                <a href="#">Giới thiệu</a>
                <a href="#">Chính sách</a>
                <a href="#">Liên hệ</a>
            </nav>
        </div>

    </footer>

    <script>
        const productsGrid = document.querySelector('#productsGrid');

        async function fetchProducts() {
            try {
                productsGrid.innerHTML = '<p>Đang tải sản phẩm...</p>';

                const response = await fetch('https://dummyjson.com/products');

                if (!response.ok) {
                    throw new Error("Không thể tải danh sách sản phẩm");
                }

                const data = await response.json();

                renderProducts(data.products);
            } catch (error) {
                productsGrid.innerHTML = `
                <p class="error-message">
                  Có lỗi xảy ra khi tải sản phẩm. Vui lòng thử lại sau.
                </p>
                `;
                console.error(error);
            }
        }

        function renderProducts(products) {
            productsGrid.innerHTML = "";

            products.forEach(product => {
                const productCard = document.createElement('article');
                productCard.classList.add('product-card');

                productCard.innerHTML = `
                    <a href="./product.html" class="product-link">
                        <img
                            class="product-image"
                            src="${product.thumbnail}"
                            alt="${product.title}"
                        />
                    </a>
                    <div class="product-info">
                        <h2>${product.title}</h2>
                        <p class="product-price">$${product.price}</p>
                        <p class="product-description">${product.description}</p>
                        <button class="add-cart-button" type="button">Thêm vào giỏ</button>
                    </div>
                `;
                productsGrid.appendChild(productCard);
            });
        }

        fetchProducts();
    </script>
</body>

</html>
